services:
  postgres:
    image: postgres:16-alpine
    container_name: cstatiwarehouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cstati
      POSTGRES_PASSWORD: cstati
      POSTGRES_DB: cstatiwarehouse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cstati -d cstatiwarehouse"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cstatiwarehouse-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Внутри compose-сети доступ к Postgres по имени сервиса, а не localhost.
      DATABASE_URL: postgres://cstati:cstati@postgres:5432/cstatiwarehouse?sslmode=disable
      HTTP_ADDR: ":8080"
      UPLOADS_DIR: /app/uploads
      PUBLIC_BASE_URL: http://192.168.1.65:8080
    volumes:
      - uploads:/app/uploads
    ports:
      - "8080:8080"

volumes:
  pgdata:
  uploads:
