name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-go:
    name: Backend (Go unit + integration)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cstati
          POSTGRES_PASSWORD: cstati
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cstati -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Go unit tests
        env:
          JWT_SECRET: "01234567890123456789012345678901234567890123456789012345678901234"
          DATABASE_URL: "postgres://cstati:cstati@localhost:5432/postgres?sslmode=disable"
        run: go test ./...

      - name: Go coverage (unit packages)
        env:
          JWT_SECRET: "01234567890123456789012345678901234567890123456789012345678901234"
          DATABASE_URL: "postgres://cstati:cstati@localhost:5432/postgres?sslmode=disable"
        run: go test ./... -coverprofile=coverage.out -covermode=atomic

      - name: Upload Go coverage
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: go-coverage-${{ github.run_number }}
          path: backend/coverage.out
          retention-days: 14
          if-no-files-found: warn

      # Интеграционные тесты делят одну БД и TRUNCATE в SetupDB — пакеты должны идти строго по одному (-p 1),
      # иначе гонки на CREATE DATABASE / миграциях (DDL в общем postgres).
      - name: Go integration tests
        env:
          JWT_SECRET: "01234567890123456789012345678901234567890123456789012345678901234"
          DATABASE_URL: "postgres://cstati:cstati@localhost:5432/postgres?sslmode=disable"
        run: go test -tags=integration -count=1 -p 1 ./...

  test:
    name: Build & Unit Tests
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      PROJECT: ios/cstatiWarehouse.xcodeproj
      SCHEME: cstatiWarehouse

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Diagnostics (Xcode, SDKs, iOS runtimes)
        run: |
          echo "=== Installed Xcodes ==="
          ls -1 /Applications | grep -i '^Xcode' || true
          echo
          echo "=== Active Xcode ==="
          xcode-select -p
          xcodebuild -version
          echo
          echo "=== Available SDKs ==="
          xcodebuild -showsdks
          echo
          echo "=== Installed simulator runtimes ==="
          xcrun simctl list runtimes

      - name: Cache SwiftPM packages
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SwiftPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Run unit tests
        run: |
          set -euo pipefail

          echo "=== Destinations known to xcodebuild for this scheme ==="
          xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -showdestinations 2>&1 | tee /tmp/destinations.txt || true
          echo

          LINE=$(grep 'platform:iOS Simulator' /tmp/destinations.txt \
            | grep 'name:iPhone' \
            | grep -v 'placeholder' \
            | head -n 1 || true)

          if [ -z "$LINE" ]; then
            echo "::error::No concrete iPhone Simulator destination available for scheme '$SCHEME'."
            echo "::error::Likely cause: the selected Xcode does not have an iOS simulator runtime matching the project's deployment target."
            exit 1
          fi

          UDID=$(echo "$LINE" | sed -E 's/.*id:([0-9A-Fa-f-]+).*/\1/')
          echo "Chosen destination line: $LINE"
          echo "Chosen UDID:             $UDID"

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b || true

          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:cstatiWarehouseTests \
            -only-testing:cstatiWarehouseUITests \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults-${{ github.run_number }}
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
