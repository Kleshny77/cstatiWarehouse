name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & Unit Tests
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      PROJECT: cstatiWarehouse.xcodeproj
      SCHEME: cstatiWarehouse
      TEST_TARGET: cstatiWarehouseTests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Resolve SwiftPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "$PROJECT" \
            -scheme "$SCHEME"

      - name: Run unit tests
        run: |
          set -euo pipefail

          # Берём UDID из того же списка, что знает сам xcodebuild,
          # чтобы гарантированно сматчить -destination.
          LINE=$(xcodebuild \
              -project "$PROJECT" \
              -scheme "$SCHEME" \
              -showdestinations 2>/dev/null \
            | grep 'platform:iOS Simulator' \
            | grep 'name:iPhone' \
            | head -n 1 || true)

          if [ -z "$LINE" ]; then
            echo "::error::No iPhone Simulator destination is available on this runner"
            xcodebuild -project "$PROJECT" -scheme "$SCHEME" -showdestinations || true
            exit 1
          fi

          UDID=$(echo "$LINE" | sed -E 's/.*id:([0-9A-Fa-f-]+).*/\1/')
          echo "Chosen destination line: $LINE"
          echo "Chosen UDID:             $UDID"

          # Прогреваем симулятор заранее — это снимает часть флейков на CI.
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b || true

          set -o pipefail
          xcodebuild test \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "platform=iOS Simulator,id=$UDID" \
            -only-testing:"$TEST_TARGET" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults-${{ github.run_number }}
          path: TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
